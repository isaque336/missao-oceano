name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: "pip"

      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            autoconf automake libtool \
            pkg-config cmake \
            zlib1g-dev libffi-dev libssl-dev \
            libncurses5-dev libncursesw5-dev \
            libltdl-dev

      - name: Instalar Buildozer e Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools<70"
          python -m pip install "buildozer==1.5.0" "cython==0.29.36"

      - name: Gerar APK
        env:
          P4A_RELEASE: "1"
        run: |
          buildozer -v android debug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: missao-oceano-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 7
